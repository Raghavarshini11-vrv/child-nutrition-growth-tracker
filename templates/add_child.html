<!DOCTYPE html>
<html>
<head>
    <title>Add Child</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f9;
            text-align: center;
        }

        .container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 20px;
            margin-top: 50px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        .age-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .age-row input {
            flex: 1;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }

        a {
            display: block;
            margin-top: 15px;
            text-decoration: none;
            color: #2196F3;
        }
    </style>
</head>

<body>

<div class="container">

<h2>Add Child Details</h2>

<!-- ✅ FIXED FORM -->
<form method="POST" action="/add">

    <input type="text" name="name" placeholder="Enter Name" required>

    <div class="age-row">
        <input type="number" name="years" placeholder="Age (Years)" min="0" required>
        <input type="number" name="months" placeholder="Months" min="0" max="11" required>
    </div>

    <input type="text" name="gender" placeholder="Enter Gender" required>

    <input type="number" name="weight" placeholder="Enter Weight (kg)" step="0.1" required>

    <input type="number" name="height" placeholder="Enter Height (cm)" step="0.1" required>

    <button type="submit">Save</button>

</form>

<!-- ✅ FIXED BACK BUTTON -->
<a href="/admin_dashboard">← Back to Dashboard</a>

</div>

</body>
</html>
